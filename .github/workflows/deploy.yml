name: Deploy BikeBuddy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]  # запускается когда открываешь PR в master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: yarila/bikebuddybackend-bikebuddy_api:latest
          file: ./BikeBuddy.Backend/src/BikeBuddy.API/Dockerfile
          context: ./BikeBuddy.Backend